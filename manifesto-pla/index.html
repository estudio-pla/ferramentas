<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#060d18; --card:#0a1628; --card2:#0d1e34;
    --blue:#1A6FBF; --blue-lt:#3A9FEF;
    --gold:#D4A83A; --txt:#c8daea; --txt2:#7a9ab8;
    --div:rgba(58,159,239,0.12);
  }
  body { background:var(--bg); color:var(--txt); font-family:'Manrope',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }

  .lang-bar {
    position:fixed; top:0; right:0; left:0; z-index:100;
    display:flex; justify-content:flex-end; padding:10px 24px;
    background:rgba(6,13,24,0.94); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--div);
  }
  .lang-btn {
    background:none; border:1px solid var(--div); color:var(--txt2);
    font-family:'Manrope',sans-serif; font-size:11px; font-weight:700;
    letter-spacing:3px; text-transform:uppercase; padding:5px 14px;
    cursor:pointer; border-radius:2px; transition:all .2s;
  }
  .lang-btn+.lang-btn { margin-left:6px; }
  .lang-btn.active { border-color:var(--blue-lt); color:var(--blue-lt); }

  header {
    padding:80px 24px 48px; text-align:center;
    border-bottom:1px solid var(--div);
    background:linear-gradient(180deg,#071828 0%,var(--bg) 100%);
  }
  .vu-wrap {
    display:flex; justify-content:center; margin-bottom:28px;
    filter:drop-shadow(0 0 28px rgba(58,159,239,0.12));
  }

  /* CSS exato v3.1 */
  #spool-L { transform-origin:100px 100px; animation:ccw 2.8s linear infinite; animation-play-state:running; }
  #spool-R { transform-origin:300px 100px; animation:ccw 2.1s linear infinite; animation-play-state:running; }
  @keyframes ccw { from{transform:rotate(0deg);} to{transform:rotate(-360deg);} }
  .ebtn { cursor:pointer; }
  .ebtn:hover rect, .ebtn:hover circle, .ebtn:hover polygon { filter:brightness(2.2); }
  @keyframes vu-idle { 0%,100%{transform:rotate(-36deg);} 50%{transform:rotate(-28deg);} }
  .needle-idle { animation:vu-idle 1.8s ease-in-out infinite; transform-origin:50px 43px; }

  .eyebrow { font-family:'Manrope',sans-serif; font-size:11px; font-weight:700; letter-spacing:5px; text-transform:uppercase; color:var(--gold); margin-bottom:16px; }
  h1 { font-family:'Lora',Georgia,serif; font-size:clamp(32px,5vw,56px); font-weight:700; line-height:1.15; color:#fff; margin-bottom:14px; }
  h1 em { color:var(--blue-lt); font-style:normal; }
  .subtitle { font-family:'Manrope',sans-serif; font-size:clamp(14px,1.6vw,17px); font-weight:400; color:var(--txt2); max-width:540px; margin:0 auto; line-height:1.6; }

  /* Player */
  .player-wrap { max-width:680px; margin:0 auto; padding:40px 24px 0; }
  .player-box { background:var(--card); border:1px solid var(--div); border-radius:10px; padding:24px 28px; }
  .player-title { font-family:'Manrope',sans-serif; font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--txt2); margin-bottom:14px; }
  .player-voices { display:flex; gap:8px; margin-bottom:12px; }
  .voice-btn { flex:1; padding:9px; background:var(--card2); border:1px solid var(--div); border-radius:4px; color:var(--txt2); font-family:'Manrope',sans-serif; font-size:12px; font-weight:600; cursor:pointer; transition:all .2s; }
  .voice-btn.active { border-color:var(--blue-lt); color:var(--blue-lt); background:rgba(58,159,239,0.07); }
  .key-row { display:flex; gap:8px; margin-bottom:10px; }
  .key-input { flex:1; padding:10px 14px; background:var(--card2); border:1px solid var(--div); border-radius:4px; color:var(--txt); font-family:'JetBrains Mono',monospace; font-size:12px; outline:none; }
  .key-input:focus { border-color:var(--blue-lt); }
  .key-link { display:flex; align-items:center; padding:0 14px; background:var(--card2); border:1px solid var(--div); border-radius:4px; color:var(--gold); font-family:'Manrope',sans-serif; font-size:12px; text-decoration:none; white-space:nowrap; }
  .key-link:hover { border-color:var(--gold); }
  .player-btns { display:flex; gap:8px; margin-bottom:10px; }
  .btn-play { flex:1; padding:12px; background:var(--blue); border:none; border-radius:4px; color:#fff; font-family:'Manrope',sans-serif; font-size:13px; font-weight:800; letter-spacing:1px; cursor:pointer; transition:background .2s; }
  .btn-play:hover { background:var(--blue-lt); }
  .btn-stop { padding:12px 18px; background:none; border:1px solid var(--div); border-radius:4px; color:var(--txt2); font-family:'Manrope',sans-serif; font-size:13px; font-weight:700; cursor:pointer; transition:all .2s; }
  .btn-stop:hover { border-color:var(--txt2); color:var(--txt); }
  .btn-dl { padding:12px 18px; background:none; border:1px solid var(--div); border-radius:4px; color:var(--gold); font-family:'Manrope',sans-serif; font-size:13px; font-weight:700; cursor:pointer; transition:all .2s; display:none; text-decoration:none; white-space:nowrap; }
  .btn-dl.visible { display:flex; align-items:center; }
  .btn-dl:hover { border-color:var(--gold); }
  .key-hint { font-size:11px; color:#3a5870; font-family:'Manrope',sans-serif; line-height:1.5; }
  .status-bar { margin-top:10px; padding:8px 12px; background:var(--card2); border-radius:4px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--txt2); min-height:32px; }

  /* Manifesto */
  .manifesto-wrap { max-width:660px; margin:0 auto; padding:60px 24px 80px; }
  .manifesto-wrap p { font-family:'Manrope',sans-serif; font-size:clamp(15px,1.6vw,17px); font-weight:400; color:var(--txt); line-height:1.9; text-align:justify; margin-bottom:20px; }
  .manifesto-wrap p.strong { font-weight:700; color:#fff; font-size:clamp(16px,1.8vw,18px); }
  .quote-bar { border-left:4px solid var(--blue-lt); padding:18px 24px; background:var(--card2); border-radius:0 8px 8px 0; margin:28px 0; font-family:'Lora',Georgia,serif; font-size:clamp(15px,1.6vw,17px); font-weight:600; color:var(--txt); line-height:1.7; text-align:left; }
  hr.div { width:48px; height:2px; border:none; margin:36px 0; background:linear-gradient(90deg,var(--blue-lt),transparent); }

  footer { border-top:1px solid var(--div); padding:32px 24px; text-align:center; }
  .footer-logo { font-family:'Lora',Georgia,serif; font-size:18px; font-weight:700; color:#fff; margin-bottom:6px; }
  .footer-sub { font-family:'Manrope',sans-serif; font-size:11px; font-weight:600; letter-spacing:4px; text-transform:uppercase; color:var(--gold); }
  .footer-copy { font-family:'Manrope',sans-serif; font-size:11px; color:#1a3050; margin-top:14px; letter-spacing:1px; }
</style>

/* ── WAV helpers ─────────────────────────────────────────────── */

/* Adiciona header WAV em dados PCM L16 brutos */
function pcmToWav(pcmBytes, sr) {
  var ch=1, bps=16, dl=pcmBytes.length;
  var buf=new ArrayBuffer(44+dl), v=new DataView(buf);
  var w=function(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF'); v.setUint32(4,36+dl,true); w(8,'WAVE');
  w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true);
  v.setUint16(22,ch,true); v.setUint32(24,sr,true);
  v.setUint32(28,sr*ch*bps/8,true); v.setUint16(32,ch*bps/8,true);
  v.setUint16(34,bps,true); w(36,'data'); v.setUint32(40,dl,true);
  new Uint8Array(buf,44).set(pcmBytes);
  return new Blob([buf],{type:'audio/wav'});
}

/* Re-encoda AudioBuffer decodificado → WAV perfeito para download */
function encodeWav(audioBuffer){
  var sr=audioBuffer.sampleRate, f32=audioBuffer.getChannelData(0), len=f32.length;
  var buf=new ArrayBuffer(44+len*2), v=new DataView(buf);
  var w=function(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF'); v.setUint32(4,36+len*2,true); w(8,'WAVE');
  w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true);
  v.setUint16(22,1,true); v.setUint32(24,sr,true);
  v.setUint32(28,sr*2,true); v.setUint16(32,2,true);
  v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,len*2,true);
  var dv=new DataView(buf,44);
  for(var i=0;i<len;i++){
    var s16=Math.max(-32768,Math.min(32767,Math.round(f32[i]*32767)));
    dv.setInt16(i*2,s16,true);
  }
  return new Blob([buf],{type:'audio/wav'});
}

/* Decodifica qualquer resposta Gemini TTS → AudioBuffer */
async function decodeGeminiAudio(b64, mimeType, ctx) {
  var raw=atob(b64), bytes=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);

  var isL16 = mimeType && (mimeType.indexOf('L16')!==-1 || mimeType.indexOf('pcm')!==-1);
  if(isL16){
    /* Extrai sample rate do mime type (ex: rate=24000) */
    var sr=24000;
    var m=mimeType.match(/rate=(\d+)/i);
    if(m) sr=parseInt(m[1]);
    /* Adiciona header WAV e decodifica */
    var wavBlob=pcmToWav(bytes, sr);
    var wavBuf=await wavBlob.arrayBuffer();
    return await ctx.decodeAudioData(wavBuf);
  } else {
    return await ctx.decodeAudioData(bytes.buffer);
  }
}

async function playAudio(){
  var key=document.getElementById('geminiKey').value.trim();
  if(!key){ setStatus(T[lang].statusNoKey); return; }
  if(isPlaying) stopAudio();
  var dl=document.getElementById('btnDl');
  dl.classList.remove('visible');
  setStatus(T[lang].statusGen+voiceName+'...');
  var prefix=lang==='pt'?VOICE_PREFIX_PT:VOICE_PREFIX_EN;
  try{
    var resp=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key='+key,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        contents:[{parts:[{text:prefix+T[lang].audio}]}],
        generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voiceName}}}}
      })
    });
    var data=await resp.json();
    if(data.error){ setStatus('⚠ Gemini: '+data.error.message); return; }
    var part=data.candidates[0].content.parts[0].inlineData;
    var b64=part.data, mimeType=part.mimeType||'';

    /* Passo 1: disponibilizar download ANTES do decode — fallback garantido */
    var rawBytes=atob(b64), pcmFallback=new Uint8Array(rawBytes.length);
    for(var i=0;i<rawBytes.length;i++) pcmFallback[i]=rawBytes.charCodeAt(i);
    var fallbackSr=24000; var mR=mimeType.match(/rate=(\d+)/i); if(mR) fallbackSr=parseInt(mR[1]);
    var isL16=mimeType.indexOf('L16')!==-1||mimeType.indexOf('pcm')!==-1;
    lastWavBlob = isL16 ? pcmToWav(pcmFallback, fallbackSr) : new Blob([pcmFallback],{type:'audio/wav'});
    dl.href=URL.createObjectURL(lastWavBlob);
    dl.setAttribute('download','manifesto-pla-'+voiceName.toLowerCase()+'.wav');
    dl.classList.add('visible');
    setStatus(T[lang].statusPlay+voiceName+' · Gemini AI — ⬇ WAV disponível');

    /* Passo 2: decodificar e reproduzir */
    try {
      audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
      var decoded=await decodeGeminiAudio(b64, mimeType, audioCtx);
      /* Melhorar o WAV com o AudioBuffer real */
      lastWavBlob=encodeWav(decoded);
      dl.href=URL.createObjectURL(lastWavBlob);
      if(audioSrc){try{audioSrc.stop();}catch(e){}}
      audioSrc=audioCtx.createBufferSource();
      audioSrc.buffer=decoded; audioSrc.connect(audioCtx.destination); audioSrc.start(0);
      isPlaying=true; setStatus(T[lang].statusPlay+voiceName+' · Gemini AI');
      audioSrc.onended=function(){ isPlaying=false; setStatus(T[lang].statusDone); };
    } catch(decErr) {
      /* Decode falhou mas download já está disponível */
      setStatus('▶ ' + voiceName + ' gerado · ⬇ Clique em Baixar WAV (playback indisponível neste browser)');
    }
  }catch(e){ setStatus(T[lang].statusErr+e.message); }
}

function stopAudio(){
  if(audioSrc){try{audioSrc.stop();}catch(e){}}
  isPlaying=false; setStatus(T[lang].statusStop);
}

/* Rolos — JS v3.1 */
(function(){
  var spL=document.getElementById('spool-L'),spR=document.getElementById('spool-R');
  var led=document.getElementById('rec-led');
  var bgPlay=document.getElementById('bg-play'),iPlay=document.getElementById('i-play');
  var bgRec=document.getElementById('bg-rec'),iRec=document.getElementById('i-rec');
  var iStop=document.getElementById('i-stop');
  var vnL=document.getElementById('vn-L'),vnR=document.getElementById('vn-R');
  var mode='PLAY',vuL=-34,vuR=-34;
  function applyMode(m){
    mode=m;
    spL.style.animationPlayState=m==='STOP'?'paused':'running';
    spR.style.animationPlayState=m==='STOP'?'paused':'running';
    iStop.setAttribute('fill',m==='STOP'?'#3A9FEF':'#1a3a5a');
    bgPlay.setAttribute('fill',m!=='STOP'?'#0d2040':'#0a1828');
    iPlay.setAttribute('fill',m!=='STOP'?'#3A9FEF':'#2a5880');
    bgRec.setAttribute('stroke',m==='REC'?'#cc2222':'#1a3a5a');
    iRec.setAttribute('fill',m==='REC'?'#ff2020':'#5a1010');
    if(m==='REC'){
      iRec.setAttribute('filter','url(#fRed)');
      led.setAttribute('fill','#ff1010');led.setAttribute('stroke','#ff5050');led.setAttribute('filter','url(#fRed)');
    } else {
      iRec.removeAttribute('filter');
      led.setAttribute('fill','#180404');led.setAttribute('stroke','#300808');led.removeAttribute('filter');
    }
  }
  document.getElementById('btn-stop').addEventListener('click',function(){applyMode('STOP');});
  document.getElementById('btn-play').addEventListener('click',function(){applyMode('PLAY');});
  document.getElementById('btn-rec').addEventListener('click',function(){applyMode('REC');});
  applyMode('PLAY');
  function vuLoop(){
    var tL=-34,tR=-34;
    if(mode!=='STOP'){ var t=Date.now()*0.001,b=mode==='REC'?Math.sin(t*1.3)*16+8:Math.sin(t*1.1)*10+1; tL=b+Math.random()*(mode==='REC'?14:10); tR=b+Math.random()*(mode==='REC'?14:10); }
    var sp=mode==='STOP'?0.04:0.20; vuL+=(tL-vuL)*sp; vuR+=(tR-vuR)*sp;
    vnL.style.transform='rotate('+Math.max(-36,Math.min(32,vuL))+'deg)';
    vnR.style.transform='rotate('+Math.max(-36,Math.min(32,vuR))+'deg)';
    requestAnimationFrame(vuLoop);
  }
  vuLoop();
})();
